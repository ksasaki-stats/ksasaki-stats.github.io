{% include base_path %}
<style>
.site-nav-simple {
  display: flex;
  align-items: center;
  gap: 1.4rem;
  font-family: inherit;
  white-space: nowrap;
}

.site-nav-simple a {
  color: var(--global-masthead-link-color);
  text-decoration: none;
}

.site-nav-simple a:hover {
  color: var(--global-masthead-link-color-hover);
}

.site-nav-simple .site-title {
  font-weight: 700;
  margin-right: 0.6rem;
}

.site-nav-simple .selected a {
  color: var(--global-text-color);
  font-weight: 700;
  border-bottom: 2px solid var(--global-text-color);
}

@media screen and (max-width: 600px) {
  .masthead__inner-wrap {
    padding: 0.35em 0.45em;
  }

  .site-nav-simple {
    gap: 0.75rem;
  }

  .site-nav-simple a {
    font-size: 0.88rem;
  }

  .site-nav-simple .site-title {
    margin-right: 0.15rem;
    font-size: 0.84rem;
  }
}
</style>
<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="site-nav-simple">
      <span class="site-title {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
        <a href="{{ base_path }}/">{{ site.title }}</a>
      </span>
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign domain = '' %}
        {% else %}
          {% assign domain = base_path %}
        {% endif %}
        <span class="{% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
          <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
        </span>
      {% endfor %}
    </nav>
  </div>
</div>
