{% include base_path %}
<style>
@media screen and (max-width: 600px) {
  .masthead__inner-wrap {
    padding: 0.35em 0.45em;
  }

  .greedy-nav {
    min-width: 0;
  }

  .greedy-nav button,
  .greedy-nav .hidden-links {
    display: none !important;
  }

  .greedy-nav .visible-links {
    display: flex !important;
    align-items: center;
    flex-wrap: nowrap;
    width: 100%;
  }

  .greedy-nav .visible-links li {
    display: block !important;
    white-space: nowrap;
  }

  .greedy-nav a {
    margin: 0 0.4rem;
    padding: 0.45rem 0;
    font-size: 0.88rem;
  }

  .masthead__menu-item--lg {
    padding-right: 0.3em;
  }

  .masthead__menu-item--lg a {
    margin-left: 0;
    font-size: 0.84rem;
  }
}
</style>
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/">{{ site.title }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item persist {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
